<!DOCTYPE html>
<html>
<head>
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Contact Us</h1>
    <p>Please fill out the form below.</p>

    <form>
        <label for="name">Name:</label>
        <input type="text"id="name"name="name"required>

        <br><br>

        <label for="email">Email:</label>
        <input type="email"id="email"name="email"required>

        <br><br>
      
        <label for="subject"> BCA 3rd Year Subject:</label>

        <select id="subject"name="subject" required>
            <option value="">Select Subject</option>
            <option value="software_engineering">Software Engineering</option>
            <option value="java">Java Programming</option>
            <option value="python"> Python Programming</option>
            <option value="database"> Database Management Sysstem </option>
            <option value="computer_network">Computer Network</option>
        </select>

        <br><br>

        <p>Preferred Contact Time:</p>

        <input type="radio"id="morning" name="contact_time"
      value="morning">
        <label for="morning">Morning</label>

          <input type="radio"id="evening" name="contact_time"
      value="evening">
        <label for="evening">Evening</label>

        <br><br>

        <input type="checkbox"id="subscribe"name="subscribe">
        <label for="subscribe">Subscribe to updates</label>

        <br><br>

        <label for="message">Message:</label><br>

        <textarea id="message"name="message"
          rows="5" cols="30"required
        ></textarea>

         <br><br>

         <button type="submit">Submit</button>
 
     </form>
</body>
</html>
